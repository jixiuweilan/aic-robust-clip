[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-robust-clip"
version = "0.1.0"
description = "2026 AIC robust fine-grained recognition starter repository"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = []
dependencies = []

[project.optional-dependencies]
audit = ["Pillow"]
training = ["Pillow", "torch>=2.6", "transformers>=4.46,<5", "numpy", "huggingface-hub>=0.34,<1"]
dev = ["Pillow", "torch>=2.6", "transformers>=4.46,<5", "numpy", "huggingface-hub>=0.34,<1"]

[project.scripts]
aic-validate-submission = "aic_robust_clip.submission:main"
aic-audit-archive = "aic_robust_clip.cli:audit_main"
aic-make-split = "aic_robust_clip.cli:split_main"
aic-build-class-map = "aic_robust_clip.cli:class_map_main"
aic-package-submission = "aic_robust_clip.cli:package_main"
aic-startup-check = "aic_robust_clip.cli:startup_main"
aic-doctor = "aic_robust_clip.pipeline_cli:doctor_main"
aic-provision-weights = "aic_robust_clip.pipeline_cli:provision_main"
aic-cache-features = "aic_robust_clip.pipeline_cli:cache_main"
aic-init-head = "aic_robust_clip.pipeline_cli:init_head_main"
aic-train = "aic_robust_clip.pipeline_cli:train_main"
aic-benchmark = "aic_robust_clip.pipeline_cli:benchmark_main"
aic-evaluate = "aic_robust_clip.pipeline_cli:evaluate_main"
aic-lock-selection = "aic_robust_clip.pipeline_cli:lock_selection_main"
aic-predict = "aic_robust_clip.pipeline_cli:predict_main"
aic-check-model = "aic_robust_clip.pipeline_cli:model_smoke_main"

[tool.setuptools.packages.find]
where = ["src"]
