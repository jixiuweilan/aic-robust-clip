[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-robust-clip"
version = "0.1.0"
description = "2026 AIC robust fine-grained recognition starter repository"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = []
dependencies = []

[project.scripts]
aic-validate-submission = "aic_robust_clip.submission:main"

[tool.setuptools.packages.find]
where = ["src"]
